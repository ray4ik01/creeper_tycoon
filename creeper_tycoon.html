<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CREEPER TYCOON — крутой крипер</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --green: #6fe05a;
        --gold: #e9c15c;
        --dia: #5fe3dc;
        --panel: #141a15;
        --line: #242e24;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
      }
      body {
        background: #0a0d0b;
        color: #cfe0c8;
        font-family: "Press Start 2P", monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 12px 12px 24px;
        gap: 10px;
        user-select: none;
        -webkit-user-select: none;
      }
      h1 {
        font-size: clamp(12px, 2.4vw, 18px);
        color: var(--green);
        letter-spacing: 3px;
        text-shadow:
          0 3px 0 #123312,
          0 5px 0 #000;
        text-align: center;
      }

      /* ── HUD ── */
      #hud {
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
        background: var(--panel);
        border: 2px solid;
        border-color: #2c3a2b #0b0f0a #0b0f0a #2c3a2b;
        box-shadow: 0 0 0 2px #000;
        padding: 10px 14px;
        font-size: 9px;
      }
      .stat {
        display: flex;
        align-items: center;
        gap: 7px;
        text-shadow: 1px 1px 0 #000;
      }
      .stat canvas {
        image-rendering: pixelated;
      }
      #hudPowder {
        color: var(--gold);
      }
      #hudDia {
        color: var(--dia);
      }
      .stat b.bump {
        display: inline-block;
        animation: bump 0.3s steps(3);
      }
      @keyframes bump {
        50% {
          transform: translateY(-3px);
        }
      }
      .lvlwrap {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .xpbar {
        width: 130px;
        height: 8px;
        background: #0b0f0a;
        border: 1px solid #2c3a2b;
        position: relative;
      }
      .xpbar i {
        position: absolute;
        inset: 1px auto 1px 1px;
        width: 0%;
        background: var(--green);
      }
      #hudRate {
        font-size: 7px;
        color: #8fb08a;
      }
      #sndBtn,
      .mbtn {
        font-family: inherit;
        font-size: 8px;
        letter-spacing: 1px;
        color: #e6eee2;
        background: #20262a;
        border: 0;
        padding: 8px 10px;
        cursor: pointer;
        box-shadow:
          inset 2px 2px 0 #454f55,
          inset -2px -2px 0 #0b0d0f,
          0 3px 0 #000;
        text-shadow: 1px 1px 0 #000;
      }
      #sndBtn:hover,
      .mbtn:hover {
        background: #2a3236;
        color: #fff;
      }
      #sndBtn:active,
      .mbtn:active {
        transform: translateY(2px);
        box-shadow:
          inset 2px 2px 0 #454f55,
          inset -2px -2px 0 #0b0d0f,
          0 1px 0 #000;
      }

      /* ── основная сетка ── */
      main {
        display: flex;
        gap: 14px;
        align-items: flex-start;
        justify-content: center;
        flex-wrap: wrap;
        width: 100%;
        max-width: 1060px;
      }
      .stage {
        position: relative;
        line-height: 0;
        flex: 0 0 auto;
        border: 3px solid;
        border-color: #2c3a2b #0b0f0a #0b0f0a #2c3a2b;
        box-shadow:
          0 0 0 3px #000,
          0 18px 40px rgba(0, 0, 0, 0.6);
      }
      canvas#cv {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        cursor:
          url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"><path d="M7 0h2v6h6v2h-6v6h-2v-6h-6v-2h6z" fill="%236fe05a" stroke="%23000" stroke-width="0.6"/></svg>')
            8 8,
          crosshair;
      }
      .stage::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0) 0 2px,
          rgba(0, 0, 0, 0.13) 2px 3px
        );
      }
      .hint {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 10px;
        text-align: center;
        font-size: 7px;
        color: #8fbf7f;
        line-height: 1.4;
        letter-spacing: 1px;
        text-shadow: 0 2px 0 #000;
        pointer-events: none;
        animation: blink 1.6s steps(2, end) infinite;
        padding: 0 8px;
      }
      @keyframes blink {
        50% {
          opacity: 0.25;
        }
      }

      /* ── панель ── */
      .panel {
        flex: 1 1 340px;
        max-width: 430px;
        min-width: 300px;
        background: var(--panel);
        border: 2px solid;
        border-color: #2c3a2b #0b0f0a #0b0f0a #2c3a2b;
        box-shadow: 0 0 0 2px #000;
        display: flex;
        flex-direction: column;
      }
      .tabs {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0;
        border-bottom: 2px solid #000;
      }
      .tabs button {
        font-family: inherit;
        font-size: 7px;
        padding: 11px 2px;
        color: #8fa88a;
        background: #10150f;
        border: 0;
        border-right: 1px solid #000;
        cursor: pointer;
        letter-spacing: 1px;
        text-shadow: 1px 1px 0 #000;
      }
      .tabs button:last-child {
        border-right: 0;
      }
      .tabs button.on {
        background: var(--panel);
        color: var(--green);
        box-shadow: inset 0 -3px 0 var(--green);
      }
      .tabs button:hover {
        color: #d5e8cf;
      }
      .tabbody {
        padding: 10px;
        overflow-y: auto;
        height: 420px;
        scrollbar-width: thin;
        scrollbar-color: #2c3a2b #0b0f0a;
      }
      .tabbody::-webkit-scrollbar {
        width: 8px;
      }
      .tabbody::-webkit-scrollbar-thumb {
        background: #2c3a2b;
      }

      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        background: #0e130f;
        border: 1px solid var(--line);
        padding: 9px;
        margin-bottom: 8px;
      }
      .row .ic {
        width: 26px;
        height: 26px;
        flex: 0 0 26px;
        image-rendering: pixelated;
      }
      .row .info {
        flex: 1;
        min-width: 0;
      }
      .row .nm {
        font-size: 8px;
        color: #e6eee2;
        margin-bottom: 5px;
        text-shadow: 1px 1px 0 #000;
      }
      .row .ds {
        font-size: 7px;
        color: #7d9a76;
        line-height: 1.55;
      }
      .row .lv {
        color: var(--green);
      }
      .buy {
        font-family: inherit;
        font-size: 7px;
        color: #ffe9a8;
        background: #3a3220;
        border: 0;
        padding: 8px 8px;
        cursor: pointer;
        box-shadow:
          inset 2px 2px 0 #6b5c34,
          inset -2px -2px 0 #14100a,
          0 2px 0 #000;
        text-shadow: 1px 1px 0 #000;
        white-space: nowrap;
      }
      .buy:hover {
        background: #4a4028;
      }
      .buy:active {
        transform: translateY(2px);
        box-shadow:
          inset 2px 2px 0 #6b5c34,
          inset -2px -2px 0 #14100a,
          0 0 0 #000;
      }
      .buy.no {
        background: #22261f;
        color: #5c6b58;
        box-shadow:
          inset 2px 2px 0 #333a30,
          inset -2px -2px 0 #0c0f0b,
          0 2px 0 #000;
        cursor: not-allowed;
      }
      .buy.dia {
        color: #c9fbf7;
        background: #1d3a38;
        box-shadow:
          inset 2px 2px 0 #2f6b66,
          inset -2px -2px 0 #0a1413,
          0 2px 0 #000;
      }
      .buy.eq {
        background: #1d3319;
        color: var(--green);
        box-shadow:
          inset 2px 2px 0 #35672c,
          inset -2px -2px 0 #0a1408,
          0 2px 0 #000;
      }
      .sect {
        font-size: 8px;
        color: #8fb08a;
        letter-spacing: 2px;
        margin: 14px 0 8px;
        text-shadow: 1px 1px 0 #000;
      }

      .qbar {
        height: 7px;
        background: #0b0f0a;
        border: 1px solid #2c3a2b;
        margin-top: 6px;
        position: relative;
      }
      .qbar i {
        position: absolute;
        inset: 1px auto 1px 1px;
        background: var(--gold);
      }
      .qdone {
        color: var(--green);
      }

      .lb {
        width: 100%;
      }
      .lb .r {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 8px;
        padding: 7px 8px;
        margin-bottom: 4px;
        background: #0e130f;
        border: 1px solid var(--line);
        color: #9fb89a;
      }
      .lb .r.me {
        border-color: var(--gold);
        color: var(--gold);
        background: #171508;
      }
      .lb .rk {
        width: 26px;
        color: #5c6b58;
      }
      .lb .me .rk {
        color: var(--gold);
      }
      .lb .nm {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .lb .sc {
        color: #cfe0c8;
      }
      .lb .me .sc {
        color: var(--gold);
      }

      .achgrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .ach {
        border: 1px solid var(--line);
        background: #0e130f;
        padding: 8px;
        font-size: 7px;
        color: #5c6b58;
        line-height: 1.6;
      }
      .ach.on {
        color: #cfe0c8;
        border-color: #3c5c34;
      }
      .ach b {
        display: block;
        font-size: 7px;
        margin-bottom: 4px;
        color: inherit;
      }
      .ach.on b {
        color: var(--gold);
      }

      .strow {
        display: flex;
        justify-content: space-between;
        font-size: 8px;
        padding: 6px 2px;
        border-bottom: 1px solid var(--line);
        color: #9fb89a;
      }
      .strow span:last-child {
        color: #e6eee2;
      }

      /* ── тосты ── */
      #toasts {
        position: fixed;
        top: 14px;
        right: 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 50;
        pointer-events: none;
      }
      .toast {
        background: #101710;
        border: 2px solid var(--green);
        color: var(--green);
        font-size: 8px;
        padding: 10px 12px;
        max-width: 270px;
        line-height: 1.6;
        box-shadow: 0 4px 0 #000;
        animation: tin 0.25s steps(4);
      }
      .toast.gold {
        border-color: var(--gold);
        color: var(--gold);
      }
      .toast.gray {
        border-color: #4a5a46;
        color: #9fb89a;
      }
      @keyframes tin {
        from {
          transform: translateX(40px);
          opacity: 0;
        }
      }
      .toast.out {
        opacity: 0;
        transition: opacity 0.4s;
      }

      @media (max-width: 820px) {
        .tabbody {
          height: 340px;
        }
        main {
          flex-direction: column;
          align-items: center;
        }
        .panel {
          width: 100%;
          max-width: 560px;
        }
      }
    </style>
  </head>
  <body>
    <h1>CREEPER TYCOON</h1>

    <div id="hud">
      <div class="stat">
        <canvas id="icPow" width="12" height="12"></canvas
        ><b id="hudPowder">0</b>
      </div>
      <div class="stat">
        <canvas id="icDia" width="12" height="12"></canvas><b id="hudDia">0</b>
      </div>
      <div class="stat lvlwrap">
        <span id="hudLvl" style="font-size: 8px; color: #9fb89a">УР. 1</span>
        <div class="xpbar"><i id="xpFill"></i></div>
      </div>
      <div class="stat">
        <span id="hudRate" style="font-size: 8px; color: #8fb08a"></span>
      </div>
      <button id="sndBtn">ЗВУК: ВКЛ</button>
    </div>

    <main>
      <div class="stage">
        <canvas id="cv" width="360" height="310"></canvas>
        <div class="hint" id="hint">кликни по криперу — взрыв даёт порох</div>
      </div>

      <div class="panel">
        <div class="tabs">
          <button data-tab="shop" class="on">АПГРЕЙД</button>
          <button data-tab="wear">ОДЕЖДА</button>
          <button data-tab="quest">ЗАДАНИЯ</button>
          <button data-tab="top">РЕКОРДЫ</button>
        </div>
        <div class="tabbody" id="tabbody"></div>
      </div>
    </main>

    <div id="toasts"></div>

    <script>
      "use strict";
      /* ═══════════════════ БАЗА ═══════════════════ */
      const cv = document.getElementById("cv");
      const g = cv.getContext("2d");
      g.imageSmoothingEnabled = false;
      const W = 360,
        H = 310,
        CX = 180;
      const PT = (U, V, Y) => [(U - V) * 6 + CX, (U + V) * 3 + 6 * Y + 48];
      const ISO = {
        top: (U0, V0, Y0) => [
          6,
          3,
          -6,
          3,
          (U0 - V0) * 6 + CX,
          3 * (U0 + V0) + 6 * Y0 + 48,
        ],
        left: (U0, Vw, Y0) => [
          6,
          3,
          0,
          6,
          (U0 - Vw) * 6 + CX,
          3 * (U0 + Vw) + 6 * Y0 + 48,
        ],
        right: (Uw, V0, Y0) => [
          -6,
          3,
          0,
          6,
          (Uw - V0) * 6 + CX,
          3 * (Uw + V0) + 6 * Y0 + 48,
        ],
      };
      function tex(gg, t, T) {
        gg.save();
        gg.transform(T[0], T[1], T[2], T[3], T[4], T[5]);
        gg.drawImage(t, 0, 0);
        gg.restore();
      }
      function poly(gg, pts, fill, stroke, lw) {
        gg.beginPath();
        gg.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i < pts.length; i++) gg.lineTo(pts[i][0], pts[i][1]);
        gg.closePath();
        if (fill) {
          gg.fillStyle = fill;
          gg.fill();
        }
        if (stroke) {
          gg.strokeStyle = stroke;
          gg.lineWidth = lw || 1;
          gg.stroke();
        }
      }
      const rgb = (c) =>
        "rgb(" +
        Math.round(c[0]) +
        "," +
        Math.round(c[1]) +
        "," +
        Math.round(c[2]) +
        ")";
      const lerp3 = (a, b, k) => [
        a[0] + (b[0] - a[0]) * k,
        a[1] + (b[1] - a[1]) * k,
        a[2] + (b[2] - a[2]) * k,
      ];
      const shade = (c, k) => [
        Math.min(255, c[0] * k) | 0,
        Math.min(255, c[1] * k) | 0,
        Math.min(255, c[2] * k) | 0,
      ];
      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      function pickW(r, items, ws) {
        let s = 0;
        for (const w of ws) s += w;
        let x = r() * s;
        for (let i = 0; i < items.length; i++) {
          x -= ws[i];
          if (x <= 0) return items[i];
        }
        return items[items.length - 1];
      }
      function makeTex(w, h, fn) {
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        const q = c.getContext("2d"),
          im = q.createImageData(w, h);
        for (let y = 0; y < h; y++)
          for (let x = 0; x < w; x++) {
            const p = fn(x, y),
              i = (y * w + x) * 4;
            im.data[i] = p[0];
            im.data[i + 1] = p[1];
            im.data[i + 2] = p[2];
            im.data[i + 3] = 255;
          }
        q.putImageData(im, 0, 0);
        return c;
      }
      function fmt(n) {
        n = Math.floor(n);
        if (n < 1000) return "" + n;
        if (n < 1e6)
          return (n / 1e3).toFixed(n < 1e4 ? 2 : 1).replace(".0", "") + "K";
        if (n < 1e9) return (n / 1e6).toFixed(2).replace(/\.?0+$/, "") + "M";
        return (n / 1e9).toFixed(2) + "B";
      }

      /* ═══════════════════ СОХРАНЕНИЕ ═══════════════════ */
      const SAVE_KEY = "creeper_tycoon_v1";
      const DEF = () => ({
        v: 1,
        powder: 0,
        diamonds: 0,
        lifetime: 0,
        lifeDia: 0,
        level: 1,
        xp: 0,
        prestige: 0,
        explosions: 0,
        upg: { charge: 0, drop: 0, speed: 0, auto: 0, luck: 0 },
        autoOn: true,
        owned: ["cap", "chain_none", "chain_gold", "out_classic"],
        wearing: { hat: "cap", chain: "chain_gold", outfit: "out_classic" },
        capColor: 0,
        ach: [],
        quests: [],
        questTier: 1,
        firstPlay: Date.now(),
        lastSeen: Date.now(),
      });
      let S = DEF();
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (raw) {
          const p = JSON.parse(raw);
          S = Object.assign(DEF(), p);
          S.upg = Object.assign(DEF().upg, p.upg || {});
          S.wearing = Object.assign(DEF().wearing, p.wearing || {});
        }
      } catch (e) {}
      function save() {
        S.lastSeen = Date.now();
        try {
          localStorage.setItem(SAVE_KEY, JSON.stringify(S));
        } catch (e) {}
      }
      setInterval(save, 6000);
      addEventListener("beforeunload", save);

      /* ═══════════════════ ЗВУК (WebAudio, без файлов) ═══════════════════ */
      let AC = null,
        master = null,
        muted = false;
      function ac() {
        if (!AC) {
          AC = new (window.AudioContext || window.webkitAudioContext)();
          master = AC.createGain();
          master.gain.value = muted ? 0 : 0.8;
          master.connect(AC.destination);
        }
        if (AC.state === "suspended") AC.resume();
        return AC;
      }
      function noiseBuf(a, dur) {
        const b = a.createBuffer(1, a.sampleRate * dur, a.sampleRate),
          d = b.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        return b;
      }
      function sfxHiss() {
        const a = ac(),
          t = a.currentTime;
        const s = a.createBufferSource();
        s.buffer = noiseBuf(a, 0.7);
        const f = a.createBiquadFilter();
        f.type = "bandpass";
        f.frequency.value = 3800;
        f.Q.value = 0.8;
        const gn = a.createGain();
        gn.gain.setValueAtTime(0.0001, t);
        gn.gain.exponentialRampToValueAtTime(0.5, t + 0.06);
        gn.gain.setValueAtTime(0.5, t + 0.35);
        gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.65);
        s.connect(f);
        f.connect(gn);
        gn.connect(master);
        s.start(t);
        s.stop(t + 0.7);
      }
      function sfxBoom() {
        const a = ac(),
          t = a.currentTime;
        const s = a.createBufferSource();
        s.buffer = noiseBuf(a, 1.3);
        const f = a.createBiquadFilter();
        f.type = "lowpass";
        f.frequency.setValueAtTime(650, t);
        f.frequency.exponentialRampToValueAtTime(45, t + 1.0);
        const gn = a.createGain();
        gn.gain.setValueAtTime(0.95, t);
        gn.gain.exponentialRampToValueAtTime(0.0001, t + 1.05);
        s.connect(f);
        f.connect(gn);
        gn.connect(master);
        s.start(t);
        s.stop(t + 1.3);
        const o = a.createOscillator(),
          og = a.createGain();
        o.type = "sine";
        o.frequency.setValueAtTime(150, t);
        o.frequency.exponentialRampToValueAtTime(28, t + 0.55);
        og.gain.setValueAtTime(0.7, t);
        og.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
        o.connect(og);
        og.connect(master);
        o.start(t);
        o.stop(t + 0.65);
      }
      function sfxPop() {
        const a = ac(),
          t = a.currentTime;
        const o = a.createOscillator(),
          gn = a.createGain();
        o.type = "triangle";
        o.frequency.setValueAtTime(220, t);
        o.frequency.exponentialRampToValueAtTime(80, t + 0.12);
        gn.gain.setValueAtTime(0.3, t);
        gn.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
        o.connect(gn);
        gn.connect(master);
        o.start(t);
        o.stop(t + 0.15);
      }
      let lastCoin = 0;
      function sfxCoin() {
        const a = ac(),
          t = a.currentTime;
        if (t - lastCoin < 0.06) return;
        lastCoin = t;
        [660, 990].forEach((fr, i) => {
          const o = a.createOscillator(),
            gn = a.createGain();
          o.type = "square";

      /* ═══════════════════ ВЗРЫВ / ДРОП / ЧАСТИЦЫ ═══════════════════ */
      let state = "normal",

      const snap = document.createElement("canvas");

      function captureParticles(t) {
        sg.clearRect(0, 0, W, H);

        const x0 = 100,
          y0 = 6,

        particles = [];
        for (let y = 0; y < h; y += 3)

            const i = (y * w + x) * 4;
            if (img[i + 3] > 40) {
              const px = x0 + x + 1,
                py = y0 + y + 1;
              const dx = px - CX,
                dy = py - 150,
                dl = Math.hypot(dx, dy) || 1,
                sp = 70 + Math.random() * 190;
              particles.push({
                x: px,
                y: py,
                ox: px,
                oy: py,
                sx: 0,
                sy: 0,
                vx: (dx / dl) * sp + (Math.random() - 0.5) * 70,
                vy: (dy / dl) * sp - 90,

              });

      }
      function hudTarget() {
        const cr = cv.getBoundingClientRect(),
          el = document.getElementById("hudPowder");
        const hr = el.getBoundingClientRect();
        if (!hr.width) return { x: W / 2, y: -20 };
        return {
          x: ((hr.left + hr.width / 2 - cr.left) / cr.width) * W,
          y: ((hr.top + hr.height / 2 - cr.top) / cr.height) * H,
        };
      }
      function bumpHud(id) {
        const el = document.getElementById(id);
        el.classList.remove("bump");
        void el.offsetWidth;
        el.classList.add("bump");
      }

      function doExplode(t) {
        captureParticles(t);
        state = "boom";
        stTime = 0;
        shake = 7;
        flash = 0.65;
        ringT = 0;
        for (let i = 0; i < 12; i++)
          smoke.push({
            x: CX + Math.random() * 90 - 45,
            y: 120 + Math.random() * 80,
            vx: Math.random() * 44 - 22,
            vy: -10 - Math.random() * 26,
            s: 3 + ((Math.random() * 3) | 0),
            a: 0.5,
            da: 1.1,
          });
        sfxBoom();

        /* ── дроп ── */
        const total = powderPerExplosion();
        const n = 1 + S.upg.drop;
        for (let i = 0; i < n; i++) {
          drops.push({
            type: "pow",
            val: Math.max(1, Math.round(total / n)),
            x: CX + Math.random() * 30 - 15,
            y: 130 + Math.random() * 20,
            vx: (Math.random() - 0.5) * 160,
            vy: -120 - Math.random() * 100,
            phase: "fly",
            t: 0,
            spr: sprPowder,
          });
        }
        if (Math.random() < bonusChance()) {
          drops.push({
            type: "gold",
            val: total * 2,
            x: CX + Math.random() * 20 - 10,
            y: 140,
            vx: (Math.random() - 0.5) * 120,
            vy: -150,
            phase: "fly",
            t: 0,
            spr: sprGold,
          });
        }
        if (Math.random() < diaChance()) {
          drops.push({
            type: "dia",
            val: 1,
            x: CX + Math.random() * 20 - 10,
            y: 140,
            vx: (Math.random() - 0.5) * 140,
            vy: -160,
            phase: "fly",
            t: 0,
            spr: sprDia,
          });
        }

        /* ── опыт и счётчики ── */
        S.explosions++;
        S.powder += 0; /* порох начисляется при сборе дропа */
        gainXP(Math.round(total / 2) + 2);
        questEvent("explode", 1);
        checkAch();
        dirty.top = true;
      }
      function gainXP(x) {
        S.xp += x;
        while (S.xp >= xpNeed()) {
          S.xp -= xpNeed();
          S.level++;
          const bonus = S.level * 20;
          S.powder += bonus;
          S.lifetime += bonus;
          toast(
            "УРОВЕНЬ " + S.level + "! БОНУС +" + fmt(bonus) + " ПОРОХА",
            "gold",
          );
          sfxLevel();
          checkAch();
        }
      }
      function collectDrop(d) {
        if (d.type === "pow") {
          S.powder += d.val;
          S.lifetime += d.val;
          questEvent("earn", d.val);
          bumpHud("hudPowder");
          floaters.push({
            x: d.x,
            y: d.y,
            txt: "+" + fmt(d.val),
            life: 1.1,
            col: "#e9c15c",
          });
        } else if (d.type === "gold") {
          S.powder += d.val;
          S.lifetime += d.val;
          questEvent("earn", d.val);
          bumpHud("hudPowder");
          sfxBuy();
          floaters.push({
            x: d.x,
            y: d.y,
            txt: "БОНУС +" + fmt(d.val),
            life: 1.3,
            col: "#f7da7c",
          });
        } else if (d.type === "dia") {
          S.diamonds += 1;
          S.lifeDia += 1;
          questEvent("dia", 1);
          bumpHud("hudDia");
          sfxBuy();
          floaters.push({
            x: d.x,
            y: d.y,
            txt: "+1 АЛМАЗ",
            life: 1.3,
            col: "#5fe3dc",
          });
          toast("АЛМАЗ В ДРОПЕ!", "gold");
          checkAch();
        }
        sfxCoin();
      }
      function update(dt, t) {
        if (state === "hiss" && stTime > hissDur()) doExplode(t);
        else if (state === "boom") {
          for (const p of particles) {
            p.vy += 260 * dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
          }
          if (stTime > 0.95) {
            state = "gather";
            stTime = 0;
            for (const p of particles) {
              p.sx = p.x;
              p.sy = p.y;
            }
          }
        } else if (state === "gather") {
          const k = Math.min(1, stTime / gatherDur()),
            e = k * k * k;
          for (const p of particles) {
            p.x = p.sx + (p.ox - p.sx) * e;
            p.y = p.sy + (p.oy - p.sy) * e;
          }
          if (k >= 1) {
            state = "normal";
            stTime = 0;
            particles = [];
            flash = Math.max(flash, 0.28);
            sfxPop();
          }
        }
        /* дроп */
        const tgt = hudTarget();
        for (let i = drops.length - 1; i >= 0; i--) {
          const d = drops[i];
          d.t += dt;
          if (d.phase === "fly") {
            d.vy += 300 * dt;
            d.x += d.vx * dt;
            d.y += d.vy * dt;
            const gy = 250 + (d.gy || 0);
            if (d.y > gy && d.vy > 0) {
              d.y = gy;
              d.vy *= -0.45;
              d.vx *= 0.7;
              if (Math.abs(d.vy) < 25) d.vy = 0;
            }
            if (d.t > 1.15) {
              d.phase = "home";
              d.sx = d.x;
              d.sy = d.y;
            }
          } else {
            const k = Math.min(1, (d.t - 1.15) / 0.55),
              e = k * k;
            d.x = d.sx + (tgt.x - d.sx) * e;
            d.y = d.sy + (tgt.y - d.sy) * e;
            if (k >= 1) {
              collectDrop(d);
              drops.splice(i, 1);
            }
          }
        }
        /* авто-подрыв */
        if (S.upg.auto > 0 && S.autoOn && state === "normal") {
          autoTimer += dt;
          if (autoTimer >= autoInt()) {
            autoTimer = 0;
            state = "hiss";
            stTime = 0;
            sfxHiss();
          }
        } else autoTimer = 0;

        for (let i = smoke.length - 1; i >= 0; i--) {
          const s = smoke[i];
          s.x += s.vx * dt;
          s.y += s.vy * dt;
          s.a -= s.da * dt;
          if (s.a <= 0) smoke.splice(i, 1);
        }
        if (ringT >= 0) {
          ringT += dt;
          if (ringT > 0.55) ringT = -1;
        }
        for (let i = floaters.length - 1; i >= 0; i--) {
          const f = floaters[i];
          f.life -= dt;
          f.y -= 22 * dt;
          if (f.life <= 0) floaters.splice(i, 1);
        }
        shake *= Math.exp(-4.2 * dt);
        flash *= Math.exp(-5.5 * dt);
        for (const sp of spores) {
          sp.y -= sp.v * dt;
          sp.x += Math.sin(t + sp.ph) * 3 * dt;
          if (sp.y < 8) {
            sp.y = H + 6;
            sp.x = Math.random() * W;
          }
        }
      }
      function render(t) {
        g.setTransform(1, 0, 0, 1, 0, 0);
        g.fillStyle = "#0a0d0b";
        g.fillRect(0, 0, W, H);
        g.save();
        g.translate(
          ((Math.random() * 2 - 1) * shake) | 0,
          ((Math.random() * 2 - 1) * shake) | 0,
        );
        for (const s of stars) {
          const a = 0.18 + 0.45 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
          g.fillStyle = "rgba(200,220,196," + a.toFixed(2) + ")";
          g.fillRect(s.x, s.y, s.s + 1, s.s + 1);
        }
        drawMoon(g);
        for (const sp of spores) {
          const a = 0.1 + 0.22 * (0.5 + 0.5 * Math.sin(t * 1.3 + sp.ph));
          g.fillStyle = "rgba(110,200,110," + a.toFixed(2) + ")";
          g.fillRect(sp.x | 0, sp.y | 0, 2, 2);
        }
        tex(g, texPlatT, ISO.top(-4, -4, 28));
        tex(g, texPlatL, ISO.left(-4, 12, 28));
        tex(g, texPlatR, ISO.right(12, -4, 28));
        drawShadow(g);
        isoBox(g, -4.5, 3, -2.5, 5, 26.6, 1.5, "#f2ce67", "#d9a832", "#a17b1e");
        g.fillStyle = "#fde9a8";
        g.fillRect(PT(-3.8, 3.6, 26.6)[0], PT(-3.8, 3.6, 26.6)[1], 3, 2);
        isoBox(g, 8.5, 0, 10.5, 2, 26.9, 1.6, "#8eeeda", "#41c2ac", "#2b9088");
        g.fillStyle = "#e6fffb";
        g.fillRect(PT(9.6, 1, 26.9)[0], PT(9.6, 1, 26.9)[1], 2, 2);

        if (state === "normal" || state === "hiss") {
          if (state === "hiss") {
            g.save();
            g.translate(
              ((Math.random() * 2 - 1) * 1.5) | 0,
              ((Math.random() * 2 - 1) * 1) | 0,
            );
            drawFigure(g, t);
            g.restore();
            const pulse = 0.22 + 0.6 * Math.abs(Math.sin(t * 26));
            g.save();
            g.globalAlpha = pulse;
            try {
              g.filter = "brightness(3.2) saturate(0.3)";
            } catch (e) {}
            drawFigure(g, t);
            try {
              g.filter = "none";
            } catch (e) {}
            g.restore();
          } else drawFigure(g, t);
        } else {
          for (const p of particles) {
            g.fillStyle = rgb(p.c);
            g.fillRect(p.x | 0, p.y | 0, 3, 3);
          }
          for (const s of smoke) {
            g.fillStyle = "rgba(190,195,185," + s.a.toFixed(2) + ")";
            g.fillRect(s.x | 0, s.y | 0, s.s, s.s);
          }
          if (ringT >= 0) {
            const rr = ringT / 0.55,
              R = 20 + rr * 230;
            g.save();
            g.strokeStyle =
              "rgba(230,240,220," + (0.7 * (1 - rr)).toFixed(2) + ")";
            g.lineWidth = 3;
            g.beginPath();
            g.moveTo(CX, 150 - R * 0.55);
            g.lineTo(CX + R, 150);
            g.lineTo(CX, 150 + R * 0.55);
            g.lineTo(CX - R, 150);
            g.closePath();
            g.stroke();
            g.lineWidth = 1;
            g.strokeStyle =
              "rgba(230,240,220," + (0.35 * (1 - rr)).toFixed(2) + ")";
            const R2 = R * 0.62;
            g.beginPath();
            g.moveTo(CX, 150 - R2 * 0.55);
            g.lineTo(CX + R2, 150);
            g.lineTo(CX, 150 + R2 * 0.55);
            g.lineTo(CX - R2, 150);
            g.closePath();
            g.stroke();
            g.restore();
          }
        }
        /* дроп поверх сцены */
        for (const d of drops) {
          g.drawImage(d.spr, (d.x - 6) | 0, (d.y - 5) | 0);
        }
        /* всплывающий текст */
        g.textAlign = "center";
        g.font = '8px "Press Start 2P"';
        for (const f of floaters) {
          g.globalAlpha = Math.min(1, f.life);
          g.fillStyle = "#000";
          g.fillText(f.txt, f.x + 1, f.y + 1);
          g.fillStyle = f.col;
          g.fillText(f.txt, f.x, f.y);
        }
        g.globalAlpha = 1;
        g.restore();
        g.drawImage(vig, 0, 0);
        if (flash > 0.01) {
          g.fillStyle =
            "rgba(255,255,240," + Math.min(0.85, flash).toFixed(2) + ")";
          g.fillRect(0, 0, W, H);
        }

      /* ═══════════════════ HUD / ТОСТЫ ═══════════════════ */
      const hudPowderEl = document.getElementById("hudPowder");
      function refreshHUD() {
        hudPowderEl.textContent = fmt(S.powder);
        document.getElementById("hudDia").textContent = fmt(S.diamonds);
        document.getElementById("hudLvl").textContent =
          "УР." + S.level + (S.prestige ? " ★" + S.prestige : "");
        document.getElementById("xpFill").style.width =
          Math.min(100, (S.xp / xpNeed()) * 100) + "%";
        document.getElementById("hudRate").textContent =
          fmt(powderPerExplosion()) + " ПОР./ВЗРЫВ";
      }
      refreshHUD();
      function toast(msg, cls) {
        const box = document.getElementById("toasts");
        const el = document.createElement("div");
        el.className = "toast " + (cls || "");
        el.textContent = msg;
        box.appendChild(el);
        setTimeout(() => {
          el.classList.add("out");
          setTimeout(() => el.remove(), 450);
        }, 3200);
        while (box.children.length > 4) box.firstChild.remove();
      }
      document.getElementById("sndBtn").addEventListener("click", function () {
        muted = !muted;
        if (master) master.gain.value = muted ? 0 : 0.8;
        this.textContent = "ЗВУК: " + (muted ? "ВЫКЛ" : "ВКЛ");
      });

      /* ═══════════════════ МАСШТАБ ═══════════════════ */
      function fit() {
        const availW = Math.min(
          Math.min(innerWidth * 0.94, 560),
          innerWidth * 0.94,
        );
        const availH = Math.max(
          240,
          innerHeight - (innerWidth > 820 ? 200 : 330),
        );
        let s = Math.min(availW / W, availH / H);
        if (s >= 1) s = Math.floor(s);
        s = Math.max(0.55, s);
        cv.style.width = W * s + "px";
        cv.style.height = H * s + "px";
      }
      addEventListener("resize", fit);
      fit();
      addEventListener("visibilitychange", () => {
        if (document.hidden) save();
      });
    </script>
  </body>
</html>
